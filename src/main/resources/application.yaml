server:
  port: 8080

spring:
  application:
    name: sgc-crud
  datasource:
    url: jdbc:mysql://localhost:3306/sgc_crud?serverTimezone=UTC
    username: root
    password: ""
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
